# ──────────────────────────────────────────────────────────────────────────────
# qMR-Robust Central Configuration
# All paths, hyper-parameters, and experiment controls live here.
# ──────────────────────────────────────────────────────────────────────────────

project:
  name: qMR-Robust
  seed: 42
  device: cuda
  mixed_precision: true

# ── Data Paths ────────────────────────────────────────────────────────────────
paths:
  # Synthetic training data (generated by SimulationManager)
  synthetic_mrf:  data/synthetic/mrf_dictionary.h5
  synthetic_mrs:  data/synthetic/mrs_spectra.h5

  # Real evaluation data (never used for training)
  biggaba:        data/real/biggaba/
  cmrf:           data/real/cmrf/

  # Outputs
  results:        results/
  leaderboard:    results/leaderboard.json
  checkpoints:    results/checkpoints/

# ── Synthetic Data Generation ─────────────────────────────────────────────────
simulation:
  mrf:
    n_signals: 5000000
    n_timepoints: 1000
    t1_range: [50.0, 3000.0]       # ms
    t2_range: [5.0, 500.0]         # ms
    m0_range: [0.5, 1.5]
    fa_schedule_variants: 5
    tr_schedule_variants: 3
    vendors: [siemens, philips, ge]
    field_strengths: [1.5, 3.0, 7.0]
    b0_shift_range: [-50.0, 50.0]  # Hz
    b1_scale_range: [0.8, 1.2]
    snr_range: [10.0, 100.0]
    n_workers: 16

  mrs:
    n_signals: 1000000
    n_points: 2048
    spectral_width: 2000.0         # Hz
    metabolites: [NAA, Glu, Gln, GABA, Cr, Cho, mI, Ins]
    te_values: [30.0, 68.0, 80.0, 144.0]
    field_strength: 3.0
    linewidth_range: [3.0, 12.0]
    snr_range: [5.0, 50.0]
    phase_error_range: [-30.0, 30.0]
    n_workers: 16

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  # Choices: resnet1d_18, resnet1d_50, vit1d, spatiotemporal_transformer, mlp_mixer
  architecture: vit1d
  input_channels: 2                # real + imaginary
  hidden_dim: 256
  dropout: 0.1
  # ViT-specific
  patch_size: 32
  n_heads: 8
  n_transformer_layers: 6
  # MRF regression head outputs T1, T2
  # MRS regression head outputs per-metabolite concentrations

# ── Robustness Algorithm ──────────────────────────────────────────────────────
algorithm:
  # Choices: erm, erm_aug, coral, dann, irm, fishr, vrex, groupdro
  name: erm
  # CORAL
  coral_penalty_weight: 1.0
  # DANN
  dann_penalty_weight: 1.0
  dann_anneal_steps: 500
  # IRM
  irm_penalty_weight: 1e3
  irm_anneal_steps: 500
  # VREx
  vrex_penalty_weight: 1e3
  # GroupDRO
  groupdro_eta: 1e-2

# ── Training ──────────────────────────────────────────────────────────────────
training:
  batch_size: 512
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  n_epochs: 100
  early_stopping_patience: 15
  scheduler: cosine               # cosine | step | plateau
  warmup_epochs: 5
  gradient_clip_val: 1.0
  n_workers: 8

# ── Augmentation (physics-based) ──────────────────────────────────────────────
augmentation:
  enabled: true
  noise_snr_range: [10.0, 100.0]
  phase_shift_range: [-10.0, 10.0]
  b1_scale_range: [0.85, 1.15]
  random_dropout_prob: 0.05

# ── Evaluation ────────────────────────────────────────────────────────────────
evaluation:
  metrics: [mae, rmse, r2, ccc, ece_regression, cka]
  ece_n_bins: 15
  target_vendors: [siemens, philips, ge]
  output_json: true
